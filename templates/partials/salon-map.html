<section id="salon-location" class="section salon-map-section" aria-labelledby="salon-map-title">
  <div class="container">
    <div class="salon-map-card">
      <div class="salon-map-heading">
        <div><p class="eyebrow">FIND US IN LEWISTOWN</p><h2 id="salon-map-title">Right here on <em>Water Street.</em></h2><p data-full-address>{{MAP_ADDRESS}}</p></div>
        <a data-map-link class="button button-primary" href="{{MAP_DIRECTIONS}}" target="_blank" rel="noopener noreferrer"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg> Get directions <span class="external-arrow" aria-hidden="true"></span></a>
      </div>
      <div class="salon-map-preview">
        <iframe data-map-embed src="{{MAP_EMBED}}" title="Street map of the neighborhood around Fashion Nails &amp; Spa in Lewistown" width="1100" height="420" loading="eager" referrerpolicy="no-referrer-when-downgrade" tabindex="-1" aria-hidden="true"></iframe>
        <a data-map-link class="salon-map-overlay" href="{{MAP_DIRECTIONS}}" target="_blank" rel="noopener noreferrer" aria-label="Get directions to Fashion Nails &amp; Spa on Google Maps"><span class="map-open-label"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg> Get directions on Google Maps <span class="external-arrow" aria-hidden="true"></span></span></a>
      </div>
      <p class="salon-map-note">See the streets around our salon above. Tap the map or “Get directions” to plan your route in Google Maps. <a data-map-link href="{{MAP_DIRECTIONS}}" target="_blank" rel="noopener noreferrer">Open Google Maps directly</a> if the map does not load.</p>
    </div>
  </div>
</section>
